[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archai-compliance"
version = "0.1.0"
description = "Automated urban-regulation compliance checking: regulation -> rule graph -> building metrics -> cited report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pypdf>=4", "rhino3dm>=8.0", "jsonschema>=4", "jinja2>=3", "fpdf2>=2.7"]

[project.optional-dependencies]
llm = ["openai>=1.30"]
index = ["chromadb>=0.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
archai = "archai.cli:main"

[tool.setuptools.packages.find]
include = ["archai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
